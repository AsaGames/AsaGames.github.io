<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Poop Odyssey</title>
<meta name="description" content="You're a poop. You got flushed. Explore 7 kingdoms in 3D, from the toilet to the ocean. A game by Asa, age 6.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='25' rx='13' ry='6' fill='%238b5a2b'/%3E%3Cellipse cx='16' cy='17' rx='10' ry='5.5' fill='%238b5a2b'/%3E%3Cellipse cx='16' cy='10' rx='6.5' ry='4.5' fill='%238b5a2b'/%3E%3Cpath d='M16 6 q3 -4 1 -6' stroke='%238b5a2b' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lilita+One&display=swap">
<style>
/* Full-screen 3D toy world; chunky sticker-style HUD and toy-box cards float on top (same family as Banana Sneak) */
:root{
  --ink:#2b1650; --paper:#fffaf0; --corn:#ffd23f; --poop:#8b5a2b; --pink:#ff5fa2; --mint:#3fe0b0; --grape:#7b4dff; --sky:#bfe9ff;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;background:var(--sky)}
#stage canvas{display:block;width:100%;height:100%;outline:none}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;gap:10px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.pill{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:3px 14px 1px;font-family:var(--display);font-size:20px;letter-spacing:.5px;
  box-shadow:0 4px 0 var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill img{width:26px;height:26px;margin:-4px 0 -2px -6px}
#kname{background:var(--corn);font-size:16px}
.stack{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.row{display:flex;gap:8px;flex-wrap:wrap}
#sizebox{display:flex;align-items:flex-end;gap:2px;padding:3px 12px 3px 10px}
#sizebox img{display:block;transition:opacity .2s, transform .2s}
#sizebox img.off{opacity:.22;filter:grayscale(1)}
#growbar{display:flex;gap:3px;margin-left:8px;align-self:center}
#growbar i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}
#growbar i.on{background:var(--corn)}
.spacer{flex:1}
.iconbtn{pointer-events:auto;width:48px;height:48px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--paper);color:var(--ink);
  box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.iconbtn svg{width:26px;height:26px}
.iconbtn:focus-visible,.mbtn:focus-visible{outline:4px solid var(--grape);outline-offset:3px}

#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:6;width:min(640px,calc(100% - 32px));
  background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:10px 18px 8px;
  font-weight:800;font-size:20px;line-height:1.3;text-align:center;pointer-events:none}
#toast{position:fixed;left:50%;top:30%;z-index:8;transform:translate(-50%,-50%);pointer-events:none;text-align:center;width:calc(100% - 32px);
  font-family:var(--display);font-size:clamp(34px,7vw,64px);line-height:1;color:var(--corn);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
#toast small{display:block;margin:12px auto 0;max-width:560px;font-size:.38em;line-height:1.25;color:var(--paper);-webkit-text-stroke:1px var(--ink);text-shadow:0 3px 0 var(--ink)}
#toast.show{animation:toastIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes toastIn{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.fl{position:absolute;left:0;top:0;font-family:var(--display);font-size:26px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);white-space:nowrap;transform:translate(-50%,-50%)}

/* ---------- cards & menus ---------- */
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.screen.dim{background:rgba(43,22,80,.35);pointer-events:auto}
.card{pointer-events:auto;background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:18px 22px 22px;max-width:100%;max-height:calc(100% - 20px);overflow:auto}
.card h2{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,42px);text-align:center;color:var(--corn);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.card p{margin:4px 0 12px;font-weight:800;font-size:18px;text-align:center;line-height:1.3}
.mbtn{font-family:var(--display);font-size:22px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);
  padding:8px 18px 6px;cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:center}
.mbtn.sel,.mbtn:hover{background:var(--corn)}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.mbtn[disabled]{opacity:.45}
.col{display:flex;flex-direction:column;gap:10px}

#title .logo{text-align:center;margin-bottom:auto;margin-top:4vh}
#title{flex-direction:column;justify-content:flex-start}
.logo b{display:block;font-family:var(--display);font-weight:400;line-height:.95;font-size:clamp(46px,10vw,104px);color:var(--corn);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink)}
.logo b+b{color:var(--pink);font-size:clamp(38px,8vw,84px)}
#titlemenu{pointer-events:auto;display:flex;flex-direction:column;gap:12px;width:min(320px,100%);margin:auto}
#titlemenu .mbtn{font-size:28px;padding:12px 18px 10px}
.keys{pointer-events:auto;margin:auto auto 2vh;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:8px 16px 6px;
  font-weight:800;font-size:16px;text-align:center;line-height:1.5;max-width:640px}
kbd{font-family:var(--display);font-weight:400;background:var(--corn);border:2px solid var(--ink);border-radius:8px;padding:0 6px;font-size:14px}

#mapui{flex-direction:column;justify-content:space-between}
#mapui .top{font-family:var(--display);font-size:clamp(30px,6vw,48px);color:var(--corn);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);margin-top:3vh}
#mapinfo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:2vh}
#mapinfo .name{font-family:var(--display);font-size:26px}
#mapinfo .sub{font-weight:800;font-size:16px}
.arrowbtn{width:56px;height:56px;padding:0;font-size:28px;border-radius:50%}
#mapgo{font-size:28px;padding:10px 26px 8px;background:var(--mint)}
#mapgo.sel{background:var(--corn)}

#shop .card{width:min(720px,100%);display:grid;grid-template-columns:200px 1fr;gap:16px}
#shopside{display:flex;flex-direction:column;align-items:center;gap:8px}
#shopside>img{width:180px;height:180px}
#shopsay{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 10px;font-weight:800;font-size:16px;line-height:1.25;text-align:center;min-height:70px}
#shoplist{display:flex;flex-direction:column;gap:7px}
#shoplist .mbtn{justify-content:flex-start;font-size:19px;padding:4px 14px 2px 6px}
#shoplist .mbtn img{width:44px;height:44px}
#shoplist .mbtn span:last-child{margin-left:auto}
@media (max-width:640px){#shop .card{grid-template-columns:1fr}#shopside>img{width:110px;height:110px}}

#closet .card{width:min(820px,100%);display:grid;grid-template-columns:240px 1fr;gap:16px}
#closetprev{width:240px;height:240px;background:radial-gradient(circle,#fff 0 55%,transparent 56%)}
#closetgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
#closetgrid .mbtn{flex-direction:column;gap:0;padding:4px;font-size:12px;aspect-ratio:1;line-height:1}
#closetgrid .mbtn img{width:100%;max-width:72px}
#closetgrid .mbtn.on{background:#c9f7d0}
#closetgrid .mbtn.sel{background:var(--corn)}
#closetgrid .mbtn .q{font-size:38px;color:#b9a7d6}
#closetinfo{grid-column:1 / -1;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;font-weight:800;font-size:17px;min-height:52px;text-align:center}
@media (max-width:640px){#closet .card{grid-template-columns:1fr}#closetprev{width:150px;height:150px;margin:auto}#closetgrid{grid-template-columns:repeat(5,1fr)}}

#ending{flex-direction:column;justify-content:space-between}
#ending .top{font-family:var(--display);font-size:clamp(40px,8vw,80px);color:var(--corn);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);margin-top:3vh;text-align:center}
#ending .card{width:min(700px,100%)}
#endstats{font-size:16px!important}
#endtip{color:#a8327f}

#intro .say{font-family:var(--display);font-size:clamp(50px,11vw,110px);color:#5fb8f0;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink)}
#intro small{position:fixed;right:16px;bottom:12px;font-weight:800;color:var(--ink);opacity:.7}

/* ---------- touch ---------- */
#touch{position:fixed;inset:0;z-index:7;pointer-events:none}
.joy{position:fixed;left:calc(max(16px,env(safe-area-inset-left,0px)) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:136px;height:136px;border-radius:50%;
  background:rgba(255,250,240,.55);border:4px solid var(--ink);touch-action:none;display:grid;place-items:center;pointer-events:auto}
.knob{width:60px;height:60px;border-radius:50%;background:var(--corn);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);pointer-events:none}
.tbtn{position:fixed;pointer-events:auto;touch-action:none;border-radius:50%;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-family:var(--display);color:var(--ink);cursor:pointer}
#tJump{right:calc(max(16px,env(safe-area-inset-right,0px)) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:116px;height:116px;background:var(--corn);font-size:24px}
#tOut{right:calc(max(16px,env(safe-area-inset-right,0px)) + 132px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:74px;height:74px;background:var(--mint);font-size:16px;line-height:1}
.tbtn.on{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.has-touch #msg{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(560px,calc(100% - 430px));min-width:220px;font-size:15px;padding:8px 12px 6px}
@media (max-width:620px){.has-touch #msg{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 110px);width:calc(100% - 32px)}}
@media (prefers-reduced-motion: reduce){#toast.show{animation:none}}
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud" id="hud" hidden>
  <div class="stack">
    <div class="pill" id="kname">TOILET BOWL KINGDOM</div>
    <div class="row">
      <div class="pill" id="goldpill"><img id="goldicon" alt="">0/5</div>
      <div class="pill" id="cornpill"><img id="cornicon" alt="">0</div>
      <div class="pill" id="sizebox" aria-label="Size"></div>
    </div>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn" id="bCloset" aria-label="Closet"><svg viewBox="0 0 24 24"><path d="M8 3l4 2 4-2 5 4-3 3-2-1v12H8V9l-2 1-3-3z" fill="#ff8fd1" stroke="#2b1650" stroke-width="2" stroke-linejoin="round"/></svg></button>
  <button class="iconbtn" id="bSound" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path id="sndpath" d="M4 9h4l5-4v14l-5-4H4z M16 8c2 2 2 6 0 8 M19 5c4 4 4 10 0 14" fill="none" stroke="#2b1650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="iconbtn" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#2b1650"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#2b1650"/></svg></button>
</div>
<div id="floaters"></div>
<div id="msg" hidden></div>
<div id="toast" hidden></div>

<div class="screen" id="title" hidden>
  <div class="logo"><b>SUPER POOP</b><b>ODYSSEY</b></div>
  <div id="titlemenu" class="menu"></div>
  <div class="keys">
    <kbd>← ↑ → ↓</kbd> run &nbsp; <kbd>SPACE</kbd> jump, and again in the air for a <b>FART JUMP</b><br>
    Walk into doors, shops and pipes &nbsp; <kbd>C</kbd> closet &nbsp; <kbd>M</kbd> sound &nbsp; <kbd>Q</kbd> <kbd>E</kbd> turn the camera
  </div>
</div>

<div class="screen" id="intro" hidden><div class="say" id="introsay"></div><small>SPACE to skip</small></div>

<div class="screen" id="mapui" hidden>
  <div class="top">THE BIG FLUSH MAP</div>
  <div id="mapinfo" class="menu card">
    <button class="mbtn arrowbtn" id="mapL" aria-label="Previous kingdom">◀</button>
    <div style="text-align:center"><div class="name" id="mapname"></div><div class="sub" id="mapsub"></div></div>
    <button class="mbtn arrowbtn" id="mapR" aria-label="Next kingdom">▶</button>
    <button class="mbtn" id="mapgo">GO!</button>
    <button class="mbtn" id="mapcloset">Closet</button>
    <button class="mbtn" id="maphome">Home</button>
  </div>
</div>

<div class="screen dim" id="shop" hidden>
  <div class="card">
    <div id="shopside"><h2>SHOP</h2><img id="ratimg" alt="Mr. Whiskers the rat"><div id="shopsay"></div><div class="pill"><img id="shopcorn" alt="">&nbsp;<span id="shopcount">0</span></div></div>
    <div id="shoplist" class="menu"></div>
  </div>
</div>

<div class="screen dim" id="closet" hidden>
  <div class="card">
    <img id="closetprev" alt="Your poop">
    <div><h2>CLOSET</h2><div id="closetgrid" class="menu" data-cols="5"></div></div>
    <div id="closetinfo"></div>
  </div>
</div>

<div class="screen dim" id="pause" hidden>
  <div class="card col menu" style="width:min(340px,100%)">
    <h2>PAUSED</h2>
    <button class="mbtn" data-act="resume">Keep playing</button>
    <button class="mbtn" data-act="closet">Closet</button>
    <button class="mbtn" data-act="map">Back to the map</button>
    <button class="mbtn" data-act="sound">Sound: ON</button>
  </div>
</div>

<div class="screen" id="ending" hidden>
  <div class="top" id="endtitle"></div>
  <div class="card">
    <p id="endtext"></p>
    <p id="endstats"></p>
    <p id="endtip"></p>
    <div class="row menu" style="justify-content:center">
      <button class="mbtn" id="endmap">Keep exploring</button>
      <button class="mbtn" id="endnew">New adventure</button>
    </div>
  </div>
</div>

<div id="touch" hidden>
  <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
  <button class="tbtn" id="tOut" aria-label="Hop out">HOP<br>OUT</button>
  <button class="tbtn" id="tJump" aria-label="Jump">JUMP</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="levels.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
